<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Coursera Accelerator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>Coursera Accelerator</h2>

  <label for="speed">Main speed (0–75%)</label>
  <div class="row">
    <input id="speed" type="number" min="0.25" max="64" step="0.25" value="16">
    <span>x</span>
  </div>

  <label for="lastSpeed">Last 25% speed</label>
  <div class="row">
    <input id="lastSpeed" type="number" min="0.25" max="64" step="0.25" value="2.5">
    <span>x</span>
  </div>

  <label class="toggle">
    <input id="autoAdvance" type="checkbox" checked>
    <span>Auto-advance</span>
  </label>

  <label class="toggle">
    <input id="backgroundPlayback" type="checkbox" checked>
    <span>Background playback</span>
  </label>

  <div class="info">
    <div><b>0–75%</b> → selected main speed</div>
    <div><b>75–100%</b> → selected last-25% speed</div>
    <div><b>Completed</b> → click Next</div>
    <div><b>Tab switched</b> → keep playing</div>
  </div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
